# Builds Hachi for macOS (dmg, arm64 + x64) and Windows (x64 installer + portable exe),
# decisions 95, 97, 123.
#   - Push a tag like v0.2.0 (must match package.json "version"): each platform builds, runs
#     the smoke test against its packaged app, then one GitHub Release gets every file.
#   - "Run workflow" on the Actions page: builds and keeps the files as downloadable artifacts.
# Unsigned for now. Signing / notarization: see README (only repository secrets are needed).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Apple Silicon runner; the Intel (x64) dmg is built on it too (no native modules).
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install (also downloads the Electron binary)
        run: npm ci
      - name: Type check, lint, format, unit tests, licenses
        run: npm run verify
      - name: Signing credentials (when the repository secrets exist)
        # Developer ID signing + notarization (decision 124, see README). Without the
        # secrets nothing is exported and the dmgs get the ad-hoc signature as before.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Developer ID signing: on"
          else
            echo "Developer ID signing: off (ad-hoc)"
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "Notarization: on"
          fi
      - name: Build dmgs (arm64 + x64)
        run: npm run dist:mac
      - name: Check the signature (Developer ID builds)
        if: env.CSC_LINK != ''
        run: |
          app="$(ls -d release/*/mac-arm64/Hachi.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ -n "${APPLE_API_KEY:-}" ]; then
            # Notarized: Gatekeeper accepts it and the ticket is stapled to the app.
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi
      - name: Smoke test the packaged app
        run: |
          app="$(ls -d release/*/mac-arm64/Hachi.app)"
          SMOKE_APP_PATH="$app/Contents/MacOS/Hachi" node scripts/smoke-e2e.mjs
      - name: Upload smoke test screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots-macos
          path: out/smoke/
          if-no-files-found: ignore
      - name: Keep the dmgs
        uses: actions/upload-artifact@v5
        with:
          name: Hachi-macOS
          path: release/*/Hachi-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install (also downloads the Electron binary)
        run: npm ci
      - name: Type check, lint, format, unit tests, licenses
        run: npm run verify
      - name: Build the installer and the portable exe (x64)
        run: npm run dist:win
      - name: Smoke test the packaged app
        run: |
          app="$(ls -d release/*/win-unpacked)"
          SMOKE_APP_PATH="$app/Hachi.exe" node scripts/smoke-e2e.mjs
      - name: Upload smoke test screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots-windows
          path: out/smoke/
          if-no-files-found: ignore
      - name: Keep the exe files
        uses: actions/upload-artifact@v5
        with:
          name: Hachi-Windows
          path: release/*/Hachi-*.exe
          if-no-files-found: error

  publish:
    # One Release with every platform's files, once all of them passed their tests.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f -name 'Hachi-*')
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hachi ${GITHUB_REF_NAME#v}" \
            --generate-notes
